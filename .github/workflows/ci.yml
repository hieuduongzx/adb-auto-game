name: CI

# The regression suite runs in ~20 s, so this gate is cheap
# and catches drift the moment it is pushed — e.g. a caller like
# apps/workflow_hub.py using a helper that packaging/build_runner.py never
# defined.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff, defects only — see ruff.toml)
        run: python -m ruff check .

      # pytest, not unittest discover: a third of the suite is pytest-style
      # functions that unittest silently skips.
      - name: Python regression suite
        run: python -m pytest -q tests

      - name: Byte-compile source and packaging
        run: python -m compileall -q src apps packaging

      - name: JavaScript syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem apps/web -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: JavaScript regression tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.cjs | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
