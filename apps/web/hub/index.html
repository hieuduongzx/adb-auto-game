<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro2k Hub</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/panel.css">
<link rel="stylesheet" href="../shared/icons.css">
<link rel="stylesheet" href="css/hub.css">
<script src="../shared/theme.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/panel.js"></script>
</head>
<body>
<!--
  THESIS: the Hub is a shelf of games, not a tool menu — the cover you recognise is the button that runs it.
  OWN-WORLD: the suite's flat operator console (tokens.css / base.css, IBM Plex, hairline panels, light + dark);
  covers are the only imagery; red is reserved for Delete, and Run is the one control repeated on every card.
  STORY: open the app, spot the game by its cover, click to run; E edits, Del deletes, New game adds one.
  FIRST VIEWPORT: 64px library bar (title, count, search, refresh, New game); below it five flat cover cards
  across, each with its name and an always-visible Run + tools footer; further rows scroll; 34px footer with
  the workflows path and keys.
  Narrow window: the same bar in two rows, the shelf reflowed to 4 / 3 / 2 / 1 columns, footer wrapped —
  the covers never shrink below readable, the shelf scrolls instead, and no control leaves the screen.
  FORM: brief-pinned five-across cover shelf inside the established world (no concept roll: precise request).
-->
<div id="app">

<header class="lib-bar">
  <span class="lib-brand" aria-hidden="true">M2</span>
  <div class="lib-heading">
    <h1 class="lib-title">Games</h1>
    <span id="count" class="lib-count" aria-live="polite"></span>
  </div>
  <div class="search-wrap">
    <i class="search-ico" data-ico="search" data-ico-size="uico-2" aria-hidden="true"></i>
    <input type="search" id="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games" aria-keyshortcuts="Control+F /">
  </div>
  <span class="lib-sp"></span>
  <div class="lib-actions">
    <span class="app-ver" id="app-version"></span>
    <button class="app-upd" id="app-update" type="button" aria-label="Update Macro2k" hidden></button>
    <button class="btn ico" id="btn-refresh" type="button" title="Refresh library" aria-label="Refresh library">
      <i data-ico="refresh-cw" aria-hidden="true"></i>
    </button>
    <button class="btn ico theme-btn" type="button" data-theme-toggle title="Switch between the light and dark theme" aria-label="Switch theme">
      <i class="ico-sun"  data-ico="sun"  aria-hidden="true"></i>
      <i class="ico-moon" data-ico="moon" aria-hidden="true"></i>
    </button>
    <button class="btn accent" id="btn-new" type="button" title="Create a new game project">
      <i data-ico="plus" aria-hidden="true"></i>New game
    </button>
  </div>
</header>

<main class="lib-main" aria-label="Game library">
  <div id="grid" class="game-grid" role="list" aria-label="Games" aria-busy="true"></div>
  <div id="empty" class="lib-empty" hidden>
    <div class="empty-ico" aria-hidden="true">
      <i data-ico="image" data-ico-size="uico-3" aria-hidden="true"></i>
    </div>
    <p class="empty-title">No games yet</p>
     <p class="empty-msg">Create a project to start building its workflow.</p>
    <!-- One of the two shows: an empty library offers a new game, a search with
         no matches offers the way back out of it. -->
    <button class="btn accent" id="btn-empty-new" type="button">
      <i data-ico="plus" aria-hidden="true"></i>New game
    </button>
    <button class="btn" id="btn-empty-clear" type="button" hidden>
      <i data-ico="x" aria-hidden="true"></i>Clear search
    </button>
  </div>
</main>

<!-- Build panel — progress + full log of a standalone Runner build. Not modal:
     the library stays usable, and Hide leaves the build running. -->
<aside id="build-panel" class="build-panel" role="region" aria-labelledby="bp-title" hidden>
  <header class="bp-head">
    <div class="bp-titles">
      <h2 class="bp-title" id="bp-title">Build</h2>
      <div class="bp-sub" id="bp-sub"></div>
    </div>
    <span class="bp-badge" id="bp-badge"></span>
    <button class="bp-x" type="button" data-bp="hide" title="Hide (the build keeps running)" aria-label="Hide build panel">
      <i data-ico="x" data-ico-size="uico-2" aria-hidden="true"></i>
    </button>
  </header>
  <div class="bp-progress">
    <div class="bp-track" role="progressbar" aria-labelledby="bp-stage" aria-valuemin="0" aria-valuemax="100" id="bp-track">
      <div class="bp-fill" id="bp-fill"></div>
    </div>
    <div class="bp-meta">
      <span class="bp-stage" id="bp-stage">Starting</span>
      <span class="bp-pct" id="bp-pct">0%</span>
      <span class="bp-time" id="bp-time">00:00</span>
    </div>
  </div>
  <div class="bp-log" id="bp-log" role="log" aria-live="off"></div>
  <footer class="bp-foot" id="bp-foot"></footer>
</aside>

<footer class="lib-foot" id="lib-foot">
  <span id="footer-path" class="foot-path" title=""></span>
  <span class="foot-keys" aria-hidden="true">
    <kbd>Enter</kbd>Run<kbd>E</kbd>Edit<kbd>B</kbd>Build<kbd>Del</kbd>Delete<kbd>/</kbd>Search
  </span>
</footer>

</div>
<script src="js/hub.js"></script>
</body>
</html>
