# Lint gate (CI runs `ruff check .`). Deliberately narrow: real defects only —
# undefined names, unused imports, late-binding closures, syntax errors — so
# the gate never argues about style in a codebase that has its own.
line-length = 120
target-version = "py310"
extend-exclude = [".delta", ".venv*", "vendor", "build", "dist", "workflows", "out"]

[lint]
select = ["E9", "F", "B006", "B008", "B023"]
